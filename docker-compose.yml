services:
  azurite:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/coffeenchill-azurite:v1.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --skipApiVersionCheck
    ports:
      - "127.0.0.1:10000:10000"
      - "127.0.0.1:10001:10001"
      - "127.0.0.1:10002:10002"
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "const net=require('net');const s=net.connect(10002,'127.0.0.1',()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1));s.setTimeout(2000,()=>process.exit(1));"]
      interval: 5s
      timeout: 3s
      retries: 20
  functions:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/coffeenchill-functions:v2.0
    ports:
      - "127.0.0.1:7071:80"
    environment:
      AzureWebJobsStorage: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"
      FUNCTIONS_WORKER_RUNTIME: dotnet-isolated
      PreparationDelaySeconds: "3"
      AzureFilesConnectionString: ${AZURE_FILES_CONNECTION_STRING:-}
    depends_on:
      azurite:
        condition: service_healthy
    restart: on-failure
volumes:
  azurite-data:
