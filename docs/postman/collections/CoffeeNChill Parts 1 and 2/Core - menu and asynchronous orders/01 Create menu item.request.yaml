$kind: http-request
url: "{{baseUrl}}/api/menu"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "Category": "Hot Drinks",
      "Id": "{{menuId}}",
      "Name": "Espresso",
      "Description": "Fresh espresso",
      "Price": 25.0,
      "IsAvailable": true
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("menuId", "COF-"+Date.now());
    language: text/javascript
  - type: afterResponse
    code: |
      pm.test("HTTP 201", () => pm.response.to.have.status(201));
    language: text/javascript
order: 1000
