$kind: http-request
url: "{{baseUrl}}/api/menu"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "Category": "Hot Drinks",
      "Id": "BAD",
      "Name": "Invalid",
      "Price": -2,
      "IsAvailable": true
    }
scripts:
  - type: afterResponse
    code: |
      pm.test("HTTP 400", () => pm.response.to.have.status(400));
    language: text/javascript
order: 5000
