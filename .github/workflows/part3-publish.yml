name: Publish Part 3 Docker images
on:
  workflow_dispatch:
  push:
    tags:
      - 'part3-v*'
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compile Functions and Gateway
        run: |
          dotnet build CoffeeNChill.csproj -c Release
          dotnet build Gateway/CoffeeNChill.Gateway.csproj -c Release
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/coffeenchill-functions:part3
          platforms: linux/amd64
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Gateway/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/coffeenchill-gateway:part3
          platforms: linux/amd64
